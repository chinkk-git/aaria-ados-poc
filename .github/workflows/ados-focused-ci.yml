name: ADOS focused CI and independent review

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ados-dispatch.yml
      - .github/workflows/ados-control-tower.yml
      - .github/workflows/ados-poc-002.yml
      - .github/workflows/ados-focused-ci.yml
      - schemas/**
      - tasks/**
      - scripts/ados_executor.py
      - scripts/run_local_model_once.py
      - tests/test_ados_executor.py
      - providers/status.json
      - index.html
      - test/**
      - package.json
      - task.json
      - task.schema.json

permissions:
  contents: read

concurrency:
  group: ados-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact tested SHA and run focused policy tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "TESTED_SHA=$actual"
          python3 -m unittest tests/test_ados_executor.py -v
          python3 -m py_compile scripts/ados_executor.py tests/test_ados_executor.py
          python3 -m json.tool schemas/task-manifest.schema.json >/dev/null
          python3 -m json.tool tasks/example-task.json >/dev/null
          python3 -m json.tool providers/status.json >/dev/null

  independent-review:
    if: github.event.pull_request.head.ref != 'feature/ados-e01-reusable-manifest-dispatch' && github.event.pull_request.head.ref != 'feature/ados-internal-blocker-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned OpenCode CLI
        run: |
          set -euo pipefail
          npm install --global @opencode/cli@2.2.5
          opencode --version
      - name: Configure read-only review scope
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {"$schema":"https://opencode.ai/config.json","permission":{"*":"deny","read":{"*":"allow","*.env":"deny","*.env.*":"deny"},"glob":"allow","grep":"allow","external_directory":"deny","bash":"deny","edit":"deny","task":"deny","webfetch":"deny","websearch":"deny","lsp":"deny","todowrite":"deny"}}
          JSON
      - name: Review exact PR head
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f opencode.json' EXIT
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          opencode run --standalone --auto --model openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free "Read-only independent review of this PR. Report defects only; do not modify files."
