name: ADOS POC 002 isolated dispatch
run-name: ADOS-POC-002 ${{ github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || format('resume-issue-{0}', inputs.issue_number) }}
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing ADOS-POC-002 issue to resume
        required: true
        type: choice
        options: ['9']
      resume_failed_run:
        description: Exact failed run to resume once
        required: true
        type: choice
        options: ['41376777156']

permissions:
  contents: read

concurrency:
  group: ados-poc-002-exclusive-write-lease
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.actor == 'chinkk-git' &&
      ((github.event_name == 'issues' &&
      github.event.issue.user.login == 'chinkk-git' &&
      github.event.issue.title == '[ADOS-POC-002] Daily Practice Complete') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.issue_number == '9' &&
      inputs.resume_failed_run == '41376777156'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      actions: read
    steps:
      - name: Checkout exclusive task branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/ados-poc-002
          persist-credentials: false

      - name: Enforce one-time resume and task scope
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_FAILED_RUN: ${{ inputs.resume_failed_run }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e daily-practice.html || { echo "REJECTED: output already exists"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "REJECTED: dirty branch"; exit 1; }
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REPOSITORY_OWNER:feature/ados-poc-002" --state all --json number --jq 'length')"
          test "$existing" = "0" || { echo "REJECTED: existing PR"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$RESUME_FAILED_RUN" = "41376777156" || { echo "REJECTED: resume must name the exact failed run"; exit 1; }
            failed_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_FAILED_RUN")"
            printf '%s' "$failed_run" | jq -e '.id == 41376777156 and .event == "issues" and .conclusion == "failure"' >/dev/null || { echo "REJECTED: prior run is not the verified failed issue dispatch"; exit 1; }
            previous_manual="$(gh run list --workflow .github/workflows/ados-poc-002.yml --event workflow_dispatch --limit 100 --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")"
            test "$previous_manual" = "0" || { echo "REJECTED: one-time resume was already used"; exit 1; }
          fi
          echo "VERIFIED: exclusive branch ready; manual resume allowance is unused"

      - name: Inspect OpenRouter free daily allowance
        id: openrouter_quota
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "state=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "OpenRouter free allowance: unavailable (secret not configured)"
            exit 0
          fi
          response="$(curl --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/key || true)"
          remaining="$(printf '%s' "$response" | jq -er '.data.free_model_daily_requests.remaining | select(type == "number")' 2>/dev/null || true)"
          unset response
          if [[ "$remaining" =~ ^[0-9]+$ ]]; then
            echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
            if (( remaining > 0 )); then
              echo "state=AVAILABLE" >> "$GITHUB_OUTPUT"
              echo "OpenRouter free allowance: available; remaining=$remaining"
            else
              echo "state=EXHAUSTED" >> "$GITHUB_OUTPUT"
              echo "OpenRouter free allowance: exhausted; remaining=0"
            fi
          else
            echo "state=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "OpenRouter free allowance: unknown; provider will be skipped"
          fi

      - name: Install pinned executor
        run: |
          set -euo pipefail
          npm install --global @opencode/cli@2.2.5
          opencode --version

      - name: Configure executor permissions
        shell: bash
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "deny",
              "read": {"*": "allow", "*.env": "deny", "*.env.*": "deny"},
              "glob": "allow",
              "grep": "allow",
              "edit": {"*": "deny", "daily-practice.html": "allow"},
              "external_directory": "deny",
              "bash": "deny",
              "task": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "lsp": "deny",
              "todowrite": "deny"
            }
          }
          JSON

      - name: Run one free provider at a time with bounded failover
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_QUOTA_STATE: ${{ steps.openrouter_quota.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f opencode.json /tmp/ados-worker-output.log' EXIT
          prompt="ADOS-POC-002. Create ONLY daily-practice.html: a self-contained accessible HTML page with a heading Daily Practice, a button Mark Complete, and a status indicator initially Not completed. Clicking the button changes status to Completed. Reload resets status to Not completed (no localStorage). Use no external dependencies, personal data, network calls, or other files. Do not edit index.html."

          attempt() {
            local provider="$1"
            local model="$2"
            local rc=0
            if [[ "$provider" == "openrouter" ]]; then
              env OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
                opencode run --standalone --auto --model "$model" "$prompt" > /tmp/ados-worker-output.log 2>&1 || rc=$?
            else
              env GOOGLE_GENERATIVE_AI_API_KEY="$GOOGLE_GENERATIVE_AI_API_KEY" \
                opencode run --standalone --auto --model "$model" "$prompt" > /tmp/ados-worker-output.log 2>&1 || rc=$?
            fi
            if (( rc == 0 )); then
              echo "VERIFIED: executor completed using provider=$provider"
              return 0
            fi
            if grep -Eiq '429|401|403|RESOURCE_EXHAUSTED|free-models-per-day|rate.?limit|quota|503|UNAVAILABLE|ECONNRESET|ETIMEDOUT|service unavailable' /tmp/ados-worker-output.log; then
              echo "PROVIDER_UNAVAILABLE: provider=$provider; classified as capacity, authentication, or service failure"
              rm -f daily-practice.html
              return 75
            fi
            echo "WORKER_FAILED: provider=$provider; non-provider failure; no failover retry"
            return "$rc"
          }

          succeeded=false
          if [[ "$OPENROUTER_QUOTA_STATE" == "AVAILABLE" && -n "${OPENROUTER_API_KEY:-}" ]]; then
            if attempt openrouter openrouter/free; then
              succeeded=true
            else
              rc=$?
              (( rc == 75 )) || exit "$rc"
            fi
          else
            echo "SKIPPED: OpenRouter quota state is $OPENROUTER_QUOTA_STATE"
          fi

          if [[ "$succeeded" != true ]]; then
            test -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" || { echo "BLOCKED: Gemini key missing and no available OpenRouter free quota"; exit 1; }
            if attempt gemini google/gemini-2.5-flash-lite; then
              succeeded=true
            else
              rc=$?
              (( rc == 75 )) && { echo "BLOCKED_QUOTA: both eligible free providers unavailable"; exit 1; }
              exit "$rc"
            fi
          fi
          test "$succeeded" = true

      - name: Enforce single-file output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain | sed 's/^...//')" = "daily-practice.html" || { echo "REJECTED: unexpected changes"; git status --short; exit 1; }
          test -s daily-practice.html || { echo "REJECTED: empty output"; exit 1; }
          echo "VERIFIED: only daily-practice.html changed"

      - name: Preserve commit checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- daily-practice.html
          git commit -m "feat: implement ADOS POC 002 practice indicator"
          gh auth setup-git
          git push origin HEAD:feature/ados-poc-002
          echo "VERIFIED: implementation pushed; PR handoff via authorized connector"
