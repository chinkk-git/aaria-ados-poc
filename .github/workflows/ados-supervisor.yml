name: ADOS supervisor (read-only)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  pull-requests: read

concurrency:
  group: ados-supervisor-readonly
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify ADOS tasks and workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime, sys
          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          now = datetime.datetime.now(datetime.timezone.utc)
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/'+repo+path,
                headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.load(resp)
          try:
              issues = get('/issues?state=open&per_page=100')
              runs = get('/actions/runs?per_page=100').get('workflow_runs',[])
              prs = get('/pulls?state=all&per_page=100')
          except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as e:
              print('BLOCKED: GitHub evidence retrieval failed:',type(e).__name__)
              sys.exit(1)
          tasks = [i for i in issues if 'pull_request' not in i and i.get('title','').startswith('[ADOS-POC-')]
          print('SUPERVISOR: read-only; '+now.isoformat()+'; tasks='+str(len(tasks)))
          for issue in tasks:
              task = issue['title'].split(']')[0][1:]
              # Match issue event directly: no guessed workflow run identity.
              matching = [r for r in runs if r.get('event')=='issues' and r.get('created_at','')>=issue['created_at']]
              matching.sort(key=lambda r:r.get('created_at',''),reverse=True)
              branch = 'feature/ados-poc-002' if task=='ADOS-POC-002' else ('feature/ados-control-plane-poc' if task=='ADOS-POC-001' else None)
              linked = [p for p in prs if branch and p.get('head',{}).get('ref')==branch]
              age = (now-datetime.datetime.fromisoformat(issue['created_at'].replace('Z','+00:00'))).total_seconds()/60
              if linked:
                  status='HANDOFF_PRESENT'
              elif matching and any(r.get('status') in ('queued','in_progress','waiting','requested','pending') for r in matching):
                  status='RUNNING_OR_QUEUED'
              elif matching and age>=20:
                  status='NEEDS_REVIEW'
              elif age>=20:
                  status='STALLED_NO_HANDOFF'
              else:
                  status='AWAITING_EVIDENCE'
              print(json.dumps({'task':task,'issue':issue['number'],'status':status,'age_minutes':round(age,1),'branch':branch,'matching_issue_event_runs':len(matching),'linked_prs':[p['number'] for p in linked],'latest_candidate_run':matching[0]['id'] if matching else None},sort_keys=True))
          print('SUPERVISOR: no retries, dispatches, merges, secret reads, or repository writes')
          PY
