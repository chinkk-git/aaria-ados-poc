name: Gemini free-tier synthetic coding test
run-name: Gemini synthetic test (one-time)

on:
  workflow_dispatch:
    inputs:
      confirm_free_tier_and_no_billing:
        description: Confirm the Gemini key still belongs to the project's Free Tier and no billing account is linked.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ados-gemini-synthetic-once
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'chinkk-git/aaria-ados-poc' && github.ref == 'refs/heads/main' && inputs.confirm_free_tier_and_no_billing == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Confirm fixed repository, manual invocation, and first attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chinkk-git/aaria-ados-poc"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          echo "PREFLIGHT: expected repository, main ref, manual event, first attempt."

      - name: Confirm secret is available without reading it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "BLOCKED: GEMINI_API_KEY is unavailable to this workflow."
            exit 1
          fi
          echo "SECRET_CHECK: present; value withheld."

      - name: Reject any prior manual execution (paginated)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          repo = os.environ["GH_REPO"]
          current = str(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          page, pages, prior = 1, 0, 0
          while True:
              query = urllib.parse.urlencode({
                  "event": "workflow_dispatch", "per_page": "100", "page": str(page)
              })
              url = "https://api.github.com/repos/" + repo + "/actions/workflows/gemini-free-tier-runner.yml/runs?" + query
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28"
              })
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      payload = json.load(response)
              except Exception:
                  print("BLOCKED: unable to verify prior workflow runs; failing closed.")
                  sys.exit(1)
              runs = payload.get("workflow_runs")
              if not isinstance(runs, list):
                  print("BLOCKED: malformed workflow history; failing closed.")
                  sys.exit(1)
              pages += 1
              prior += sum(
                  1 for run in runs
                  if str(run.get("id")) != current and run.get("head_branch") == "main"
              )
              if len(runs) < 100:
                  break
              page += 1
              if page > 1000:
                  print("BLOCKED: workflow history pagination limit reached.")
                  sys.exit(1)
          if prior:
              print("BLOCKED: a prior manual execution exists; no second request is allowed.")
              sys.exit(1)
          print("DUPLICATE_CHECK: PASS; pages_scanned=" + str(pages) + "; prior_runs=0.")
          PY

  generate-and-validate:
    needs: preflight
    if: github.repository == 'chinkk-git/aaria-ados-poc' && github.ref == 'refs/heads/main' && inputs.confirm_free_tier_and_no_billing == true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout SHA and pinned model
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "WORKFLOW_SHA=$EXPECTED_SHA"
          echo "MODEL=gemini-3.5-flash-lite"
          echo "FREE_TIER_EVIDENCE=owner-confirmed association with the verified Google AI Studio Free Tier project."
          echo "OWNER_BILLING_ATTESTATION=confirmed at manual dispatch."

      - name: Install pinned isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.64.1
          docker pull mcr.microsoft.com/playwright:v1.64.1-noble

      - name: Make exactly one Gemini API request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OUTPUT_PATH: ${{ runner.temp }}/daily-practice.html
          EVIDENCE_PATH: ${{ runner.temp }}/gemini-evidence.json
          SUMMARY_PATH: ${{ github.step_summary }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          key = os.environ.get("GEMINI_API_KEY", "")
          if not key:
              print("BLOCKED: Gemini secret is unavailable; value withheld.")
              sys.exit(1)
          model = "gemini-3.5-flash-lite"
          prompt = (
              "Create one self-contained accessible HTML document for a synthetic task. "
              "It must have the exact heading Daily Practice, a button named Mark Complete, "
              "a status initially reading Not completed, and clicking the button changes it "
              "to Completed. Reloading must return to Not completed. Use no external resources, "
              "dependencies, network calls, storage, or unrelated content. Include a document "
              "language, title, semantic heading, native button, and role=status with aria-live=polite. "
              "Return only the complete HTML document, without Markdown fences."
          )
          body = json.dumps({
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0, "candidateCount": 1, "maxOutputTokens": 3000}
          }).encode("utf-8")
          url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent"
          request = urllib.request.Request(
              url, data=body,
              headers={"Content-Type": "application/json", "x-goog-api-key": key},
              method="POST"
          )
          started = time.monotonic()
          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(RejectRedirects)
          try:
              with opener.open(request, timeout=90) as response:
                  status = response.status
                  raw = response.read(2_000_001)
          except urllib.error.HTTPError as error:
              print("GEMINI_REQUEST: attempted=1; HTTP status=" + str(error.code) + "; response withheld.")
              sys.exit(1)
          except Exception:
              print("GEMINI_REQUEST: attempted=1; transport or timeout failure; response withheld.")
              sys.exit(1)
          elapsed = round(time.monotonic() - started, 2)
          if status != 200 or len(raw) > 2_000_000:
              print("GEMINI_REQUEST: attempted=1; invalid status or oversized response; response withheld.")
              sys.exit(1)
          try:
              data = json.loads(raw)
              candidates = data.get("candidates", [])
              if len(candidates) != 1:
                  raise ValueError("candidate count")
              parts = candidates[0].get("content", {}).get("parts", [])
              text = "".join(part.get("text", "") for part in parts if isinstance(part, dict))
              if not text.strip() or len(text.encode("utf-8")) > 100_000:
                  raise ValueError("empty or oversized output")
          except Exception:
              print("GEMINI_REQUEST: attempted=1; response shape rejected; response withheld.")
              sys.exit(1)
          usage_value = data.get("usageMetadata", {})
          usage = usage_value if isinstance(usage_value, dict) else {}
          def safe_count(value):
              return value if type(value) is int and 0 <= value <= 10_000_000 else None
          evidence = {
              "model": model, "requests_attempted": 1, "http_status": status,
              "prompt_tokens": safe_count(usage.get("promptTokenCount")),
              "candidate_tokens": safe_count(usage.get("candidatesTokenCount")),
              "total_tokens": safe_count(usage.get("totalTokenCount")),
              "request_duration_seconds": elapsed
          }
          with open(os.environ["OUTPUT_PATH"], "w", encoding="utf-8") as output:
              output.write(text)
          with open(os.environ["EVIDENCE_PATH"], "w", encoding="utf-8") as output:
              json.dump(evidence, output, sort_keys=True)
              output.write("\n")
          with open(os.environ["SUMMARY_PATH"], "a", encoding="utf-8") as summary:
              summary.write("## Gemini request evidence\n\n")
              summary.write("- Model: " + model + "\n")
              summary.write("- Requests attempted: 1\n")
              summary.write("- HTTP status: 200\n")
              summary.write("- Prompt / candidate / total tokens: " +
                            str(evidence["prompt_tokens"]) + " / " +
                            str(evidence["candidate_tokens"]) + " / " +
                            str(evidence["total_tokens"]) + "\n")
              summary.write("- Request duration: " + str(elapsed) + " s\n")
              summary.write("- Free-tier source: owner-confirmed Free Tier project; no automated billing API is available to this runner.\n")
          print("GEMINI_REQUEST: attempted=1; status=200; model=" + model +
                "; duration_seconds=" + str(elapsed) + "; token counts recorded.")
          PY

      - name: Validate generated page in sandboxed Chromium with network blocked
        env:
          CANDIDATE_PATH: ${{ runner.temp }}/daily-practice.html
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$RUNNER_TEMP/gemini-candidate"
          install -m 0644 "$CANDIDATE_PATH" "$RUNNER_TEMP/gemini-candidate/daily-practice.html"
          timeout --signal=TERM --kill-after=5s 90s docker run --rm \
            --network=none \
            --user=pwuser \
            --security-opt seccomp="$GITHUB_WORKSPACE/scripts/chromium-seccomp.json" \
            --volume "$GITHUB_WORKSPACE/scripts:/workspace/scripts:ro" \
            --volume "$GITHUB_WORKSPACE/node_modules:/workspace/node_modules:ro" \
            --volume "$RUNNER_TEMP/gemini-candidate:/candidate:ro" \
            --workdir /workspace \
            --env HOME=/home/pwuser \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            node scripts/validate_gemini_html.mjs /candidate/daily-practice.html

      - name: Save successful synthetic output as text evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ runner.temp }}/daily-practice.html" "${{ runner.temp }}/daily-practice-output.txt"

      - name: Upload successful synthetic output and usage metadata
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gemini-daily-practice-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/daily-practice-output.txt
            ${{ runner.temp }}/gemini-evidence.json
          retention-days: 7
