name: Gemini runner policy and functional tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gemini-free-tier-runner.yml
      - .github/workflows/gemini-runner-ci.yml
      - scripts/validate_gemini_html.mjs
      - scripts/test_gemini_validator.mjs
      - scripts/chromium-seccomp.json

permissions:
  contents: read

concurrency:
  group: gemini-runner-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check syntax and install pinned browser test dependency
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/validate_gemini_html.mjs
          node --check scripts/test_gemini_validator.mjs
          npm install --no-save --package-lock=false playwright@1.64.1
          docker pull mcr.microsoft.com/playwright:v1.64.1-noble

      - name: Run deterministic browser tests against exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "TESTED_SHA=$EXPECTED_SHA"
          timeout --signal=TERM --kill-after=5s 180s docker run --rm \
            --network=none \
            --user=pwuser \
            --security-opt seccomp="$GITHUB_WORKSPACE/scripts/chromium-seccomp.json" \
            --volume "$GITHUB_WORKSPACE/scripts:/workspace/scripts:ro" \
            --volume "$GITHUB_WORKSPACE/node_modules:/workspace/node_modules:ro" \
            --workdir /workspace \
            --env HOME=/home/pwuser \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            node --test scripts/test_gemini_validator.mjs
